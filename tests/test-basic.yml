name: Test basic SSH agent usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate a test SSH key pair
        run: |
          ssh-keygen -t ed25519 -C "test@example.com" -f /tmp/test_key -N ""
          echo "TEST_SSH_KEY<<EOF" >> $GITHUB_ENV
          cat /tmp/test_key >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - id: ssh-agent
        name: Start SSH agent with test key
        uses: .
        with:
          ssh-private-key: ${{ env.TEST_SSH_KEY }}

      - name: Assert SSH_AUTH_SOCK is set
        run: |
          echo "SSH_AUTH_SOCK: $SSH_AUTH_SOCK"
          if [ -z "$SSH_AUTH_SOCK" ]; then
            echo "FAIL: SSH_AUTH_SOCK is not set"
            exit 1
          fi
          echo "PASS: SSH_AUTH_SOCK is set to $SSH_AUTH_SOCK"

      - name: Assert SSH agent socket exists
        run: |
          echo "Checking socket: $SSH_AUTH_SOCK"
          if [ ! -S "$SSH_AUTH_SOCK" ]; then
            echo "FAIL: SSH agent socket does not exist at $SSH_AUTH_SOCK"
            exit 1
          fi
          echo "PASS: SSH agent socket exists"

      - name: Assert key is loaded in agent
        run: |
          KEY_COUNT=$(ssh-add -l | wc -l)
          echo "Keys loaded: $KEY_COUNT"
          ssh-add -l
          if [ "$KEY_COUNT" -lt 1 ]; then
            echo "FAIL: No keys loaded in SSH agent"
            exit 1
          fi
          echo "PASS: At least one key is loaded"

      - name: Assert loaded key fingerprint matches
        run: |
          EXPECTED_FP=$(ssh-keygen -lf /tmp/test_key.pub | awk '{print $2}')
          echo "Expected fingerprint: $EXPECTED_FP"
          LOADED_FP=$(ssh-add -l | awk '{print $2}')
          echo "Loaded fingerprint: $LOADED_FP"
          if [ "$LOADED_FP" != "$EXPECTED_FP" ]; then
            echo "FAIL: Fingerprint mismatch"
            exit 1
          fi
          echo "PASS: Fingerprint matches"
