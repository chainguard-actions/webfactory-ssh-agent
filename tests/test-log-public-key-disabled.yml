name: Test SSH agent with log-public-key disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate a test SSH key pair
        run: |
          ssh-keygen -t rsa -b 2048 -C "test@example.com" -f /tmp/test_key_nolog -N ""
          echo "TEST_SSH_KEY<<EOF" >> $GITHUB_ENV
          cat /tmp/test_key_nolog >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - id: ssh-agent
        name: Start SSH agent with log-public-key disabled
        uses: .
        with:
          ssh-private-key: ${{ env.TEST_SSH_KEY }}
          log-public-key: false

      - name: Assert SSH_AUTH_SOCK is set
        run: |
          echo "SSH_AUTH_SOCK: $SSH_AUTH_SOCK"
          if [ -z "$SSH_AUTH_SOCK" ]; then
            echo "FAIL: SSH_AUTH_SOCK is not set"
            exit 1
          fi
          echo "PASS: SSH_AUTH_SOCK is set"

      - name: Assert SSH agent socket exists
        run: |
          if [ ! -S "$SSH_AUTH_SOCK" ]; then
            echo "FAIL: SSH agent socket does not exist at $SSH_AUTH_SOCK"
            exit 1
          fi
          echo "PASS: SSH agent socket exists"

      - name: Assert key is loaded despite log-public-key being false
        run: |
          KEY_COUNT=$(ssh-add -l | wc -l)
          echo "Keys loaded: $KEY_COUNT"
          ssh-add -l
          if [ "$KEY_COUNT" -lt 1 ]; then
            echo "FAIL: No keys loaded in SSH agent"
            exit 1
          fi
          echo "PASS: Key is loaded even with log-public-key=false"
