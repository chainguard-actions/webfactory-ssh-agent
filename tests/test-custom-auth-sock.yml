name: Test custom SSH auth socket path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate a test SSH key pair
        run: |
          ssh-keygen -t rsa -b 2048 -C "test@example.com" -f /tmp/test_rsa_key -N ""
          echo "TEST_PRIVATE_KEY<<EOF" >> $GITHUB_ENV
          cat /tmp/test_rsa_key >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - id: ssh-agent
        name: Run ssh-agent action with custom socket path
        uses: .
        with:
          ssh-private-key: ${{ env.TEST_PRIVATE_KEY }}
          ssh-auth-sock: /tmp/custom-ssh-agent.sock

      - name: Assert SSH_AUTH_SOCK matches custom path
        env:
          EXPECTED_SOCK: /tmp/custom-ssh-agent.sock
        run: |
          echo "SSH_AUTH_SOCK: $SSH_AUTH_SOCK"
          echo "Expected: $EXPECTED_SOCK"
          if [ "$SSH_AUTH_SOCK" != "$EXPECTED_SOCK" ]; then
            echo "FAIL: SSH_AUTH_SOCK '$SSH_AUTH_SOCK' does not match expected '$EXPECTED_SOCK'"
            exit 1
          fi
          echo "PASS: SSH_AUTH_SOCK matches custom path"

      - name: Assert custom socket file exists
        run: |
          if [ ! -S "/tmp/custom-ssh-agent.sock" ]; then
            echo "FAIL: Custom socket file does not exist at /tmp/custom-ssh-agent.sock"
            exit 1
          fi
          echo "PASS: Custom socket file exists"

      - name: Assert key is loaded in agent
        run: |
          ssh-add -l
          if [ $? -ne 0 ]; then
            echo "FAIL: No keys loaded in SSH agent"
            exit 1
          fi
          echo "PASS: SSH agent has keys loaded"
