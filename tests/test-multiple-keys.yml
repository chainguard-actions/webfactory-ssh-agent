name: Test SSH agent with multiple keys
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate two test SSH key pairs
        run: |
          ssh-keygen -t ed25519 -C "key1@example.com" -f /tmp/test_key1 -N ""
          ssh-keygen -t ed25519 -C "key2@example.com" -f /tmp/test_key2 -N ""
          # Combine both private keys separated by newline (as the action expects)
          {
            echo "MULTI_SSH_KEY<<EOF"
            cat /tmp/test_key1
            cat /tmp/test_key2
            echo "EOF"
          } >> $GITHUB_ENV

      - id: ssh-agent
        uses: .
        with:
          ssh-private-key: ${{ env.MULTI_SSH_KEY }}
          log-public-key: true

      - name: Assert SSH_AUTH_SOCK is set
        run: |
          echo "SSH_AUTH_SOCK: $SSH_AUTH_SOCK"
          if [ -z "$SSH_AUTH_SOCK" ]; then
            echo "FAIL: SSH_AUTH_SOCK is not set"
            exit 1
          fi
          echo "PASS: SSH_AUTH_SOCK is set"

      - name: Assert both keys are loaded in the SSH agent
        run: |
          KEY_COUNT=$(ssh-add -l | wc -l)
          echo "Number of keys loaded: $KEY_COUNT"
          ssh-add -l
          if [ "$KEY_COUNT" -lt 2 ]; then
            echo "FAIL: expected at least 2 keys, got $KEY_COUNT"
            exit 1
          fi
          echo "PASS: $KEY_COUNT keys loaded in SSH agent"

      - name: Assert fingerprints of both keys are present
        run: |
          FP1=$(ssh-keygen -lf /tmp/test_key1.pub | awk '{print $2}')
          FP2=$(ssh-keygen -lf /tmp/test_key2.pub | awk '{print $2}')
          AGENT_KEYS=$(ssh-add -l)
          echo "Key 1 fingerprint: $FP1"
          echo "Key 2 fingerprint: $FP2"
          echo "Agent keys: $AGENT_KEYS"
          if ! echo "$AGENT_KEYS" | grep -q "$FP1"; then
            echo "FAIL: key 1 fingerprint not found in agent"
            exit 1
          fi
          if ! echo "$AGENT_KEYS" | grep -q "$FP2"; then
            echo "FAIL: key 2 fingerprint not found in agent"
            exit 1
          fi
          echo "PASS: both key fingerprints found in agent"
