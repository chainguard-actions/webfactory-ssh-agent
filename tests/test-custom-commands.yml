name: Test custom command inputs (ssh-agent-cmd, ssh-add-cmd, git-cmd)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Generate a temporary SSH key for testing
        run: |
          ssh-keygen -t ed25519 -C "test@example.com" -f /tmp/test_key -N ""
          echo "TEST_SSH_KEY<<EOF" >> $GITHUB_ENV
          cat /tmp/test_key >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
      - id: action
        uses: .
        with:
          ssh-private-key: ${{ env.TEST_SSH_KEY }}
          ssh-agent-cmd: ssh-agent
          ssh-add-cmd: ssh-add
          git-cmd: git
          log-public-key: true
      - name: Assert SSH_AUTH_SOCK is set
        run: |
          echo "SSH_AUTH_SOCK: $SSH_AUTH_SOCK"
          if [ -z "$SSH_AUTH_SOCK" ]; then
            echo "FAIL: SSH_AUTH_SOCK is not set"
            exit 1
          fi
          echo "PASS: SSH_AUTH_SOCK is set to $SSH_AUTH_SOCK"
      - name: Assert SSH agent has loaded key
        run: |
          COUNT=$(ssh-add -l | wc -l)
          echo "Keys in agent: $COUNT"
          if [ "$COUNT" -lt 1 ]; then
            echo "FAIL: no keys loaded in SSH agent"
            exit 1
          fi
          echo "PASS: SSH agent has $COUNT key(s) loaded"
